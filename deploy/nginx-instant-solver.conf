# Per-visitor rate limits. A solve compiles and runs hundreds of programs (and
# may call the paid model API), so it gets the tightest limit.
limit_req_zone $binary_remote_addr zone=cps_solve:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=cps_run:10m  rate=20r/m;
limit_req_zone $binary_remote_addr zone=cps_api:10m  rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name @DOMAIN@;

    client_max_body_size 2m;
    limit_req_status 429;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Live pipeline progress (Server-Sent Events): must not be buffered or
    # compressed, or every stage arrives at once at the end.
    location = /api/solve/stream {
        limit_req zone=cps_solve burst=2 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
    }

    location = /api/solve {
        limit_req zone=cps_solve burst=2 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 900s;
    }

    location = /api/run {
        limit_req zone=cps_run burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 60s;
    }

    location /api/ {
        limit_req zone=cps_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
